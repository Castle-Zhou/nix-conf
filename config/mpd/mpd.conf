# ~/.config/mpd/mpd.conf

# ========================================
# 文件和目录
# ========================================

# 音乐目录（修改为你的音乐文件夹路径）
music_directory    "~/Music"

# MPD 数据目录
playlist_directory "~/.local/share/mpd/playlists"
db_file            "~/.config/mpd/database"
log_file           "~/.config/mpd/log"
pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker.sql"

# ========================================
# 网络设置
# ========================================

# 绑定地址（localhost 只允许本机连接）
bind_to_address    "localhost"

# 端口
port               "6600"

# ========================================
# 音频输出
# ========================================

# PipeWire/PulseAudio 输出（推荐）
audio_output {
    type           "pipewire"
    name           "PipeWire Sound Server"
}

# 如果你使用 PulseAudio 而不是 PipeWire
# audio_output {
#     type           "pulse"
#     name           "PulseAudio Sound Server"
# }

# ALSA 输出（备选）
# audio_output {
#     type           "alsa"
#     name           "ALSA Sound Card"
#     mixer_type     "software"
# }

# FIFO 可视化输出（用于 ncmpcpp 可视化）
audio_output {
    type           "fifo"
    name           "Visualizer"
    path           "/tmp/mpd.fifo"
    format         "44100:16:2"
}

# ========================================
# 其他设置
# ========================================

# 自动更新数据库
auto_update        "yes"

# 日志级别
log_level          "default"

# 音量标准化
volume_normalization "no"

# 重放增益
replaygain         "auto"

# 文件系统字符编码
filesystem_charset "UTF-8"
